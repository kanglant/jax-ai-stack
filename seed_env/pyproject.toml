[project]
name = "jax-ai-stack"
dynamic = ["version"]
description = ""
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "jax-ai-stack authors", email="jax-dev+jax-ai-stack@google.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
]
keywords = []

# pip dependencies of the project
dependencies = [
    "absl-py>=2.3.1",
    "aiofiles>=24.1.0",
    "array-record>=0.8.1 ; sys_platform != 'win32'",
    "attrs>=25.3.0",
    "auditwheel>=6.4.1",
    "build>=1.2.2.post1",
    "cffi>=2.0.0 ; platform_python_implementation == 'PyPy'",
    "chex>=0.1.90",
    "cloudpickle>=3.1.1",
    "colorama>=0.4.6",
    "contourpy>=1.3.2",
    "cycler>=0.12.1",
    "dataclasses-json>=0.6.7",
    "dm-tree>=0.1.9",
    "etils>=1.13.0",
    "execnet>=2.1.1",
    "filelock>=3.18.0",
    "flatbuffers>=25.2.10",
    "flax>=0.11.1,<0.11.2",
    "fonttools>=4.59.0",
    "fsspec>=2025.7.0",
    "grain>=0.2.12",
    "humanize>=4.13.0",
    "hypothesis>=6.136.4",
    "importlib-resources>=6.5.2",
    "iniconfig>=2.1.0",
    "jax>=0.7.0,<0.7.1",
    "jaxlib>=0.7.0,<0.7.1",
    "jaxtyping>=0.3.2",
    "kiwisolver>=1.4.8",
    "libtpu>=0.0.19 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "markdown-it-py>=3.0.0",
    "marshmallow>=3.26.1",
    "matplotlib>=3.10.3",
    "mdurl>=0.1.2",
    "ml-dtypes>=0.5.3",
    "more-itertools>=10.8.0",
    "mpmath>=1.3.0",
    "msgpack>=1.1.1",
    "mypy-extensions>=1.1.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.0.2 ; python_version >= '3.11' and python_version <= '3.12'",
    "numpy>=2.1.3 ; python_version >= '3.13'",
    "opt-einsum>=3.4.0",
    "optax>=0.2.5",
    "orbax-checkpoint>=0.11.24",
    "orbax-export>=0.0.6,<0.0.7",
    "packaging>=25.0",
    "pillow>=11.3.0",
    "pluggy>=1.6.0",
    "portpicker>=1.6.0",
    "protobuf>=6.32.0",
    "psutil>=7.0.0",
    "pycparser>=2.23 ; implementation_name != 'PyPy' and platform_python_implementation == 'PyPy'",
    "pyelftools>=0.32",
    "pygments>=2.19.2",
    "pyparsing>=3.2.3",
    "pyproject-hooks>=1.2.0",
    "pytest-xdist>=3.8.0",
    "pytest>=8.4.1",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "scipy>=1.16.0",
    "setuptools>=80.9.0",
    "simplejson>=3.20.1",
    "six>=1.17.0",
    "sortedcontainers>=2.4.0",
    "tensorstore>=0.1.76",
    "toolz>=1.0.0",
    "treescope>=0.1.10",
    "typing-extensions>=4.14.1",
    "typing-inspect>=0.9.0",
    "wadler-lindig>=0.1.7",
    "wheel>=0.45.1",
    "wrapt>=1.17.3",
    "zipp>=3.23.0",
    "zstandard>=0.23.0",
]

[project.urls]
homepage = "https://github.com/jax-ml/jax_-ai-stack"
repository = "https://github.com/jax-ml/jax-ai-stack"
# Other: `documentation`, `changelog`

[project.optional-dependencies]
# Development deps (unittest, linting, formating,...)
# Installed through `pip install .[dev]`
dev = [
    "pytest",
    "pytest-xdist",
]

# TensorFlow datasets is an extra because it has a large install footprint.
tfds = [
    "tensorflow==2.20.0",
    "tensorflow_datasets==4.9.9",
]

# Grain is now part of the default installation; keep this for
# backward compatibility.
grain = []

[tool.pyink]
# Formatting configuration to follow Google style-guide
line-length = 80
preview = true
pyink-indentation = 2
pyink-use-majority-quotes = true

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
]

[tool.setuptools]
packages = ["jax_ai_stack"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "jax_ai_stack.__version__"}

[tool.ruff.lint.per-file-ignores]
# F811: Redefinition of unused name.
"docs/source/digits_vae.ipynb" = ["F811"]
